show_on_tv:
  fields:
    camera:
      required: true
      selector:
        entity:
          integration: blink_instant_events
          domain: camera
    media_player:
      required: true
      selector:
        entity:
          domain: media_player
    duration:
      default: 60
      selector:
        number:
          min: 10
          max: 300
          unit_of_measurement: s
    only_if_on:
      default: true
      selector:
        boolean:

enroll_face:
  fields:
    name:
      required: true
      example: Rohan
      selector:
        text:
    camera:
      selector:
        entity:
          domain: camera
    file:
      example: /media/faces/rohan.jpg
      selector:
        text:
    detection:
      example: 3f9a0c2b7d1e4a5b6c7d8e9f
      selector:
        text:
    face:
      default: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box
    force:
      default: false
      selector:
        boolean:

delete_face:
  fields:
    name:
      required: true
      selector:
        text:

process_snapshot:
  fields:
    camera:
      required: true
      selector:
        entity:
          domain: camera
